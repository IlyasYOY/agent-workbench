name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq shellcheck

      - name: Cache Neovim
        uses: actions/cache@v5
        with:
          path: .test-deps
          key: nvim-${{ runner.os }}-${{ runner.arch }}-v0.12.4-${{ hashFiles('Makefile') }}

      - name: Check
        run: make check NVIM_VERSION=v0.12.4
