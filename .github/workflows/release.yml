name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure default branch
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "Releases must run from ${{ github.event.repository.default_branch }}." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq shellcheck

      - name: Compute next version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          latest_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$latest_tag" ] && [ "$(git rev-list "${latest_tag}..HEAD" --count)" = "0" ]; then
            echo "No commits found after $latest_tag; refusing to create an empty release." >&2
            exit 1
          fi

          latest_version="${latest_tag#v}"
          if [ -z "$latest_version" ]; then
            latest_version="0.0.0"
          fi
          IFS=. read -r major minor patch <<< "$latest_version"

          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown release type: $BUMP" >&2
              exit 1
              ;;
          esac

          next_tag="v${major}.${minor}.${patch}"
          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            echo "Tag $next_tag already exists." >&2
            exit 1
          fi
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Check
        run: make check

      - name: Tag and push
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits
