# Core settings
model = "gpt-5.6-sol"
personality = "pragmatic"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
service_tier = "default"
suppress_unstable_features_warning = true

# Safety and execution
# Opt in to the maximum extended context exposed by Codex for GPT-5.6.
# model_context_window = 872000

[sandbox_workspace_write]
network_access = false
writable_roots = [
    "{{DOTFILES_DIR}}",
    "{{NVIM_WORKBENCH_DIR}}",
    "{{AGENT_WORKBENCH_DIR}}",
    "{{KB_DIR}}",
]

# Features and memory

[features]
# These flags do not uninstall account plugins or hide skills already loaded
# into the current Codex session.
plugins = true
apps = false
remote_plugin = false
default_mode_request_user_input = true
memories = true

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = false

# Interface

[notice]
hide_rate_limit_model_nudge = true
fast_default_opt_out = true

[tui]
notifications = true
notification_method = "bel"
notification_condition = "always"
status_line = [
    "model-with-reasoning",
    "current-dir",
    "context-remaining",
]
session_picker_view = "comfortable"
pet = "disabled"

# Trusted projects

[projects."{{AGENT_WORKBENCH_DIR}}"]
trust_level = "trusted"
[projects."{{DOTFILES_DIR}}"]
trust_level = "trusted"
[projects."{{KB_DIR}}"]
trust_level = "trusted"
[projects."{{NVIM_WORKBENCH_DIR}}"]
trust_level = "trusted"
[projects."{{PERSONAL_PROJECTS_DIR}}"]
trust_level = "trusted"
